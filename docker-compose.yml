services:
  postgres:
    image: postgres:16-alpine
    container_name: dce-shipbot-db
    restart: unless-stopped
    command: ["postgres", "-p", "2732"]
    ports:
      - "${POSTGRES_PORT:-2732}:2732"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shipbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shipbot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-shipbot_db}
      PGPORT: 2732
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 2732 -U ${POSTGRES_USER:-shipbot} -d ${POSTGRES_DB:-shipbot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dce-shipbot-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-2700}:2700"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 2700
      APP_URL: ${APP_URL:-http://localhost:2700}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-shipbot}:${POSTGRES_PASSWORD:-shipbot_secret}@postgres:2732/${POSTGRES_DB:-shipbot_db}}
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      ZALO_OA_ACCESS_TOKEN: ${ZALO_OA_ACCESS_TOKEN:-}
      ZALO_REFRESH_TOKEN: ${ZALO_REFRESH_TOKEN:-}

volumes:
  pg_data:
